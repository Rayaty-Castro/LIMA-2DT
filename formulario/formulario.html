<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- --------------- FORMULARIOS EM HTML --------------- -->
<form> <!-- estrutura do formulário -->
    
    <fieldset> 
        
        <legend>Informações de contato</legend>

        <label for="nome">Nome:</label> <!-- indicação do input -->
        <input type= "text" id="nome" placeholder="Informe seu nome" required> <!-- campo de entrada -->
        <br>
        
        <label for="email">E-mail:</label>
        <input type= "email" id="email" placeholder="Informe seu e-mail" required >
       
        <br>

        <label for="senha">Senha:</label>
        <input type= "password" id="senha" placeholder="Informe sua senha" required >


        <br>
        <label for="data">Data de nascimento:</label>
        <input type= "date" id="data" required >
        
        <br>
        <fieldset>
            
            <legend>Preferências</legend>
           
            <p>Informe sua cor favorita:</p>
            
            <label><input type="radio" name="cor">Azul</label>
            <label><input type="radio" name="cor">vermelho</label>
            <label><input type="radio" name="cor">Verde</label>
            <label><input type="radio" name="cor">Amarelo</label>

            <br>
            <legend>qual fruta?</legend>
           
            <p>Informe sua fruta favorita:</p>
            <label><input type="radio" name="fruta">maçã</label>
            <label><input type="radio" name="fruta">banana</label>
            
            <label for="idioma">Idioma:</label>
            <select name="idioma" id="idioma">
                <option value="pt">Português</option>
                <option value="en">Inglês</option>
                <option value="es">Espanhol</option>
            </select>
        </fieldset>


    

        
    </fieldset>
    <button type="submit">Enviar</button> <!-- botão de envio -->
</form>

</body>
</html>
